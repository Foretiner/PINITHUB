name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  face-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/face/requirements.txt
      - run: python -m compileall -q services/face/app evaluation
      - run: python -m pytest -q services/face/test_main.py evaluation/test_metrics.py
  web-and-api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bioidentity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pinithub-bio-api db:generate
      - run: pnpm --filter pinithub-bio-api test
      - run: pnpm build
