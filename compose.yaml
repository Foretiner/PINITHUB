services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bioidentity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bioidentity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioidentity"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bioidentity_pgdata:
